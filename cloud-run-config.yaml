# Google Cloud Run Environment Configuration Template
# Copy this to cloud-run-env.yaml and fill in your values

env_variables:
  TELEGRAM_API_ID: "your_api_id"
  TELEGRAM_API_HASH: "your_api_hash"
  TELEGRAM_SESSION: "your_session_name"
  WEBHOOK_URL: "https://your-webhook-url.com/endpoint"
  MONGODB_URI: "mongodb+srv://username:password@cluster.mongodb.net/database"
  ERROR_NOTIFICATION_BOT_TOKEN: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
  ERROR_NOTIFICATION_CHAT_ID: "-1001234567890"
  PYTHONUNBUFFERED: "1"

# Resource Configuration
resources:
  memory: "512Mi"
  cpu: "1"

# Scaling Configuration  
scaling:
  min_instances: 1
  max_instances: 3
  
# Other settings
settings:
  region: "us-central1"
  allow_unauthenticated: false
  timeout: 900  # 15 minutes
  concurrency: 1
