steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/telegram-listener:$BUILD_ID",
        "-t",
        "gcr.io/$PROJECT_ID/telegram-listener:latest",
        ".",
      ]

  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/telegram-listener:$BUILD_ID"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/telegram-listener:latest"]

  # Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "telegram-listener",
        "--image",
        "gcr.io/$PROJECT_ID/telegram-listener:$BUILD_ID",
        "--region",
        "us-central1",
        "--platform",
        "managed",
        "--no-allow-unauthenticated",
        "--memory",
        "512Mi",
        "--cpu",
        "1",
        "--min-instances",
        "1",
        "--max-instances",
        "3",
        "--timeout",
        "900",
        "--concurrency",
        "1",
        "--port",
        "8080",
        "--set-env-vars",
        "PYTHONUNBUFFERED=1",
      ]

options:
  logging: CLOUD_LOGGING_ONLY
