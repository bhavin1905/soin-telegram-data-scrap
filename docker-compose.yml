version: '3.8'

services:
  telegram-listener:
    build: .
    container_name: telegram-listener
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION=${TELEGRAM_SESSION}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - MONGODB_URI=${MONGODB_URI}
      - ERROR_NOTIFICATION_BOT_TOKEN=${ERROR_NOTIFICATION_BOT_TOKEN}
      - ERROR_NOTIFICATION_CHAT_ID=${ERROR_NOTIFICATION_CHAT_ID}
    volumes:
      - ./your_session_name.session:/app/your_session_name.session
    networks:
      - telegram-network

networks:
  telegram-network:
    driver: bridge
